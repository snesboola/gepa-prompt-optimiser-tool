[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gepa-optimizer"
version = "0.1.0"
description = "Agent-agnostic GEPA (reflective prompt evolution) optimizer for workflow-based LLM systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "gepa>=0.1.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tqdm>=4.0",
    # gepa declares no deps of its own -- a litellm model string (ours or
    # reflection_lm's) needs this installed regardless.
    "litellm>=1.0",
    "tenacity>=8.0",  # litellm's own retry logic imports this lazily; not pulled in automatically
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gepa-opt = "gepa_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` also walks into dev/reference/gepa-ai-gepa's
# own test suite (a full separate repo via the pinned submodule) and fails
# to collect it (different/missing dev dependencies) -- restrict discovery
# to our own tests.
testpaths = ["dev/tests"]
